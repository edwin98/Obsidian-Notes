# 可选 LlamaFactory 教学模板，对应正文08。采用前固定框架与模板版本。
# 模型规模与下列超参不是实验结论；GPU数量由实际资源决定。
model_name_or_path: checkpoints/sft/merged
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,v_proj

# 已按source_group拆分，不使用val_size重新随机分割同一问题。
dataset_dir: data
dataset: dpo_5g
eval_dataset: dpo_5g_validation
template: qwen3
cutoff_len: 4096
preprocessing_num_workers: 1
overwrite_cache: false

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-6
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
dataloader_num_workers: 0
# 需要分片时显式提供经过验证的配置；本目录不假装附带缺失的DeepSpeed文件。

per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50
save_strategy: steps
save_steps: 50
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
output_dir: checkpoints/dpo
logging_steps: 5
report_to: none
plot_loss: true

# 标准sigmoid偏好目标；参考路径与SFT基座/适配器关系需按框架版本核对。
pref_beta: 0.1
pref_loss: sigmoid
