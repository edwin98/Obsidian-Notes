[project]
name = "five-g-agent-learning"
version = "0.1.0"
description = "5G Agent 系统的可执行教学实现"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.1.2,<2",
    "langchain-openai>=1.1.11,<2",
    "langsmith>=0.7.20,<1",
    "python-dotenv>=1,<2",
    "fastapi>=0.129,<1",
    "uvicorn>=0.41,<1",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=3,<4", "psycopg[binary]>=3.3,<4"]
# 固定到实际完成 CPU 训练演练的组合，方便学习时重现 Trainer 与批次行为。
training = [
    "torch==2.10.0",
    "transformers==5.4.0",
    "datasets==4.8.2",
    "peft==0.18.1",
    "trl==1.1.0",
    "accelerate==1.13.0",
]

[dependency-groups]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

